var S = sample();
var db = null, timer = null;
var ACCTS = [[1101,'موجودی نقد و بانک','دارایی'],[1102,'پیش‌پرداخت به پیمانکاران','دارایی'],[1103,'مالیات بر ارزش افزوده (خرید)','دارایی'],[1104,'کار در جریان ساخت','دارایی'],[1105,'حساب‌های دریافتنی (کارفرمایان)','دارایی'],[1106,'اسناد دریافتنی','دارایی'],[1107,'موجودی مصالح در انبار','دارایی'],[1109,'تنخواه گردان','دارایی'],[1201,'اموال، ماشین‌آلات و تجهیزات','دارایی'],[1202,'تأسیسات موقت کارگاهی','دارایی'],[1203,'استهلاک انباشته','دارایی'],[2101,'حساب‌های پرداختنی پیمانکاران','بدهی'],[2102,'حسن انجام کار پیمانکاران','بدهی'],[2103,'بیمه پرداختنی','بدهی'],[2104,'مالیات تکلیفی پرداختنی','بدهی'],[2105,'اسناد پرداختنی','بدهی'],[2106,'سایر کسورات پرداختنی','بدهی'],[2107,'حساب‌های پرداختنی تجاری','بدهی'],[2108,'پیش‌دریافت از کارفرما','بدهی'],[2109,'مالیات بر ارزش افزوده (فروش)','بدهی'],[2201,'وام‌ها و تسهیلات بانکی','بدهی'],[2202,'حقوق و دستمزد پرداختنی','بدهی'],[3101,'سرمایه','حقوق صاحبان سهام'],[3102,'سود (زیان) انباشته','حقوق صاحبان سهام'],[4101,'درآمد پروژه‌ها','درآمد'],[4102,'سایر درآمدها','درآمد'],[5101,'هزینه‌های عمومی و اداری','هزینه'],[5102,'هزینه مصالح','هزینه'],[5103,'هزینه حقوق و دستمزد','هزینه'],[5104,'هزینه اجاره','هزینه'],[5105,'هزینه حمل و نقل','هزینه'],[5106,'هزینه استهلاک','هزینه'],[5107,'هزینه کارمزد و خدمات بانکی','هزینه'],[5108,'هزینه سوخت و انرژی','هزینه'],[5109,'هزینه ابزار و لوازم کارگاهی','هزینه'],[5110,'هزینه ایمنی و لباس کار','هزینه']];
function ensure(s) {

  if (!s.persons) s.persons = [];
  if (!s.assets) s.assets = [];
  if (!s.guarantees) s.guarantees = [];
  if (!s.purchases) s.purchases = [];
  if (!s.checks) s.checks = [];
  if (!s.recv) s.recv = [];
  return s;

S = ensure(S);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(timer);
  timer = setTimeout(function () {
    if (db) db.doc('ledger/state').set({json: JSON.stringify(S)}).catch(function () {});
  }, 600);
}
var N = function (v) { return parseFloat(v) || 0; };
var fmt = function (v) { return Math.round(v).toLocaleString('en-US'); };

var one = function (arr, k, v) { return arr.filter(function (x) { return x[k] === v; })[0]; };
